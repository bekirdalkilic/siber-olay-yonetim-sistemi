{% extends "temel.html" %}
{% block baslik %}Giriş{% endblock %}
{% block icerik %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Giriş yap</h1>
        <p class="text-body-secondary small mb-4">Güvenlik Duvarı Olay Yönetimi</p>

        {% if hata %}
        <div class="alert alert-danger" role="alert">{{ hata }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('web.giris') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="kullanici_adi" class="form-label">Kullanıcı adı</label>
            <input type="text" class="form-control" id="kullanici_adi" name="kullanici_adi"
                   value="{{ kullanici_adi or '' }}" maxlength="50" required autofocus
                   autocomplete="username">
          </div>
          <div class="mb-4">
            <label for="parola" class="form-label">Parola</label>
            <input type="password" class="form-control" id="parola" name="parola"
                   maxlength="256" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Giriş yap</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
